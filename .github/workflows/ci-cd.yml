name: WCU Digital Campus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  MYSQL_VERSION: '8.0'

jobs:
  # =============================================
  # TESTING & QUALITY ASSURANCE
  # =============================================
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: wcu_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Backend Dependencies
      run: |
        cd server
        npm ci

    - name: Install Frontend Dependencies
      run: |
        cd client
        npm ci

    - name: Setup Test Database
      run: |
        mysql -h 127.0.0.1 -u root -ptest_password wcu_test_db < database-schema.sql

    - name: Run Backend Tests
      env:
        NODE_ENV: test
        DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/wcu_test_db
        REDIS_URL: redis://127.0.0.1:6379
        JWT_SECRET: test_jwt_secret
      run: |
        cd server
        npm run test:coverage

    - name: Run Frontend Tests
      env:
        REACT_APP_API_URL: http://localhost:5000
      run: |
        cd client
        npm run test:coverage

    - name: Run E2E Tests
      run: |
        cd client
        npm run test:e2e

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        files: ./server/coverage/lcov.info,./client/coverage/lcov.info
        flags: unittests
        name: wcu-coverage

  # =============================================
  # SECURITY SCANNING
  # =============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy Scan Results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Audit NPM Dependencies
      run: |
        cd server && npm audit --audit-level high
        cd ../client && npm audit --audit-level high

  # =============================================
  # BUILD & CONTAINERIZATION
  # =============================================
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/wcu-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/wcu-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/wcu-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/wcu-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =============================================
  # DEPLOY TO STAGING
  # =============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Railway (Staging)
      uses: railway-app/railway@v1
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
        service: wcu-staging
      env:
        NODE_ENV: staging
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
        JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}

    - name: Run Staging Health Check
      run: |
        sleep 30
        curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1

    - name: Run Staging E2E Tests
      run: |
        cd client
        REACT_APP_API_URL=${{ secrets.STAGING_URL }} npm run test:e2e:staging

  # =============================================
  # DEPLOY TO PRODUCTION
  # =============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy Backend to Railway
      uses: railway-app/railway@v1
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
        service: wcu-backend-prod
      env:
        NODE_ENV: production
        DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
        JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        FACE_API_KEY: ${{ secrets.PROD_FACE_API_KEY }}

    - name: Deploy Frontend to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./client

    - name: Update Database Schema
      run: |
        # Run database migrations
        curl -X POST "${{ secrets.PROD_API_URL }}/api/admin/migrate" \
          -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}"

    - name: Production Health Check
      run: |
        sleep 60
        curl -f ${{ secrets.PROD_URL }}/api/health || exit 1
        curl -f ${{ secrets.PROD_FRONTEND_URL }} || exit 1

    - name: Notify Deployment Success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 WCU Digital Campus deployed successfully to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # =============================================
  # PERFORMANCE MONITORING
  # =============================================
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          ${{ secrets.PROD_FRONTEND_URL }}
          ${{ secrets.PROD_FRONTEND_URL }}/student-dashboard
          ${{ secrets.PROD_FRONTEND_URL }}/exam-interface
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: Load Testing with Artillery
      run: |
        npm install -g artillery
        artillery run performance/load-test.yml --target ${{ secrets.PROD_API_URL }}

  # =============================================
  # BACKUP & MONITORING
  # =============================================
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Create Database Backup
      run: |
        # Create automated backup
        curl -X POST "${{ secrets.PROD_API_URL }}/api/admin/backup" \
          -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}"

    - name: Upload Backup to S3
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Sync Backup Files
      run: |
        aws s3 sync ./backups s3://wcu-backups/$(date +%Y-%m-%d)/