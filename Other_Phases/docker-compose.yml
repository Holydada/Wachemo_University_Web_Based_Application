# Wachemo University Digital Campus - Development Environment
# Run with: docker-compose up -d

version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: wcu_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wcu_root_2024
      MYSQL_DATABASE: wcu_digital_campus
      MYSQL_USER: wcu_user
      MYSQL_PASSWORD: wcu_password_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - wcu_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wcu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wcu_network
    command: redis-server --appendonly yes --requirepass wcu_redis_2024

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wcu_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: mysql://wcu_user:wcu_password_2024@database:3306/wcu_digital_campus
      REDIS_URL: redis://:wcu_redis_2024@redis:6379
      JWT_SECRET: wcu_jwt_secret_key_2024_very_secure
      FACE_API_KEY: your_face_recognition_api_key
      UPLOAD_PATH: /app/uploads
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - wcu_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wcu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000
      REACT_APP_FACE_API_URL: http://localhost:5000/api/face
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - wcu_network
    depends_on:
      - backend
    command: npm start

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wcu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - uploads_data:/var/www/uploads
    networks:
      - wcu_network
    depends_on:
      - frontend
      - backend

  # MinIO for File Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: wcu_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: wcu_minio_admin
      MINIO_ROOT_PASSWORD: wcu_minio_password_2024
    volumes:
      - minio_data:/data
    networks:
      - wcu_network
    command: server /data --console-address ":9001"

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: wcu_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - wcu_network
    depends_on:
      - database

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local

networks:
  wcu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16