<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wachemo University — Digital Campus System</title>
    <meta
      name="description"
      content="Wachemo University — Let your light shine in the society!"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --maroon: #7a0a2d;
        --ink: #0e2336;
        --text: #1b2430;
        --muted: #f4f6f8;
        --line: #e9eef2;
        --container: 1200px;
        --radius: 12px;
        --footer: #0f1216;
        --header-height: 132px;
        --hero-image-left: url("https://www.wcu.edu.et/HomeBannerslidesImages/gate3.jpg");
        --ui: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        --display: "DM Serif Display", Georgia, "Times New Roman", serif;
        /* Header animation variables (updated via JS) */
        --hdrShift: 0%; /* 0..100 */
        --radX: 10%; /* radial center X */
        --radY: 0%; /* radial center Y */
      }    
  * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--ui);
        color: var(--text);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        padding-top: var(--header-height);
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        max-width: var(--container);
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ===== Buttons ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 2px solid transparent;
        font-weight: 700;
        transition: 0.2s;
      }
      .btn.primary {
        background: var(--maroon);
        color: #fff;
      }
      .btn.primary:hover {
        filter: brightness(0.95);
      }
      .btn.white {
        background: #fff;
        color: var(--maroon);
        border-color: #fff;
      }
      .btn.ghost {
        background: transparent;
        border-color: currentColor;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      } 
     /* ===== Header with premium color transition ===== */
      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        transition: background 0.35s ease, box-shadow 0.35s ease,
          color 0.35s ease;
      }
      body:not(.scrolled) .site-header {
        color: #fff;
        background:
        conic-gradient(
            from 200deg at calc(60% + var(--hdrShift)) 50%,
            rgba(255, 255, 255, 0.16),
            rgba(255, 255, 255, 0) 30%
          ),
          linear-gradient(
              90deg,
              rgba(122, 10, 45, 0.92),
              rgba(196, 46, 83, 0.66) 50%,
              rgba(18, 104, 175, 0.42)
            ),
          radial-gradient(
              140% 180% at var(--radX) var(--radY),
              rgba(255, 255, 255, 0.08),
              rgba(255, 255, 255, 0) 60%
            );
        background-blend-mode: screen, multiply, normal;
        background-size: 140% 140%, 200% 200%, cover;
        animation: hdrFlow 16s ease-in-out infinite;
        box-shadow: 0 8px 28px rgba(122, 10, 45, 0.25);
      }
      @keyframes hdrFlow {
        0% {
          background-position: 0% 30%, 0% 50%, center;
        }
        50% {
          background-position: 100% 70%, 100% 50%, center;
        }
        100% {
          background-position: 0% 30%, 0% 50%, center;
        }
      }
      .site-header::after {
        content: "";
        position: absolute;
        left: -20vw;
        right: -20vw;
        bottom: 0;
        height: 2px;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.8),
          rgba(255, 255, 255, 0)
        );
        transform: translateX(calc(var(--hdrShift) * -1));
        filter: blur(0.4px);
      }
