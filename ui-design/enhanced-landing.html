<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wachemo University — Digital Campus System</title>
    <meta name="description" content="Wachemo University — Let your light shine in the society!" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    
    <!-- Include original styles from wcu-landing-pro-v10.html -->
    <link rel="stylesheet" href="../wcu-landing/wcu-landing-pro-v10.html" />
    
    <style>
        /* Additional styles for digital campus modules */
        .digital-services {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 80px 0;
        }
        
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }
        
        .service-module {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .service-module::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--maroon), #c42e53);
        }
        
        .service-module:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        
        .module-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--maroon), #c42e53);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 16px;
        }
        
        .module-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }
        
        .module-desc {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        .module-features {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        
        .module-features li {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 6px;
            padding-left: 16px;
            position: relative;
        }
        
        .module-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--maroon);
            font-weight: bold;
        }
        
        .module-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--maroon);
            color: white;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .module-action:hover {
            background: #5a0821;
            transform: translateY(-1px);
        }
        
        .portal-access {
            background: var(--maroon);
            color: white;
            padding: 60px 0;
            text-align: center;
        }
        
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }
        
        .portal-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 32px 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .portal-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }
        
        .portal-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }
        
        .portal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
        }
        
        .portal-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .portal-btn {
            background: white;
            color: var(--maroon);
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        
        .portal-btn:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
